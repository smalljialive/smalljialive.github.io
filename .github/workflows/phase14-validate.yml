name: Phase 14 Validation

on:
  push:
    branches:
      - fix/site-quality-phase-14

permissions:
  contents: write

concurrency:
  group: phase-14-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Phase 14 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: blog

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Apply approved Phase 14 changes
        run: python .github/phase14_apply.py apply
        working-directory: ./blog

      - name: Validate source changes
        run: python .github/phase14_apply.py source
        working-directory: ./blog

      - name: Install dependencies
        run: npm ci
        working-directory: ./blog

      - name: Audit dependencies
        run: npm audit --audit-level=low
        working-directory: ./blog

      - name: Clean Hexo output
        run: npx hexo clean
        working-directory: ./blog

      - name: Generate Hexo site
        run: npx hexo generate
        working-directory: ./blog

      - name: Validate generated site
        run: python .github/phase14_apply.py generated
        working-directory: ./blog

      - name: Commit approved changes and remove temporary validation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "_config.anzhiyu.yml" \
            "source/_posts/Contact Form7 标准留言代码.md" \
            "source/_posts/如何在网站中引入一个音乐播放器.md" \
            "source/_posts/网站上传robot-txt文件.md"
          git commit -m "Fix outdated tutorial examples and site labels"
          git rm .github/phase14_apply.py .github/workflows/phase14-validate.yml
          git commit -m "Remove temporary Phase 14 validation helpers"
          git push origin HEAD:fix/site-quality-phase-14
        working-directory: ./blog
