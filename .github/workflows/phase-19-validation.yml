name: Phase 19 Validation

on:
  push:
    branches:
      - fix/site-quality-phase-19

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Apply exact approved edits
        run: python .github/phase19_apply.py

      - name: Verify exact source file set
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git -c core.quotePath=false diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'source/_posts/一键转换】将机场节点转换为socks节点，实现一个节点一个端口.md' \
            'source/_posts/全国古玩市场大全.md' \
            'source/_posts/v2ray搭建详细教程.md' \
            'source/_posts/wordpress创建子主题方法.md' \
            'source/_posts/禁用wordpress插件的更新-全部禁用和部分禁用.md' | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Generate Hexo site
        run: |
          npx hexo clean
          npx hexo generate
          html_count="$(find public -type f -name '*.html' | wc -l)"
          total_count="$(find public -type f | wc -l)"
          echo "Generated HTML files: $html_count"
          echo "Generated total files: $total_count"
          test "$html_count" -eq 138
          test "$total_count" -eq 167

      - name: Verify historical paths and rendered Markdown
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  self.parts.append(data)
              def text(self):
                  return ''.join(self.parts)

          def read_page(relative):
              path = Path('public') / relative / 'index.html'
              if not path.is_file():
                  raise SystemExit(f'Missing historical generated path: {path}')
              raw = path.read_text(encoding='utf-8')
              parser = TextParser()
              parser.feed(raw)
              return raw, parser.text()

          _, socks_text = read_page('2025/12/18/一键转换】将机场节点转换为socks节点，实现一个节点一个端口')
          _, disable_text = read_page('2025/04/03/禁用wordpress插件的更新-全部禁用和部分禁用')
          child_raw, child_text = read_page('2024/11/28/wordpress创建子主题方法')
          _, v2ray_text = read_page('2024/06/15/v2ray搭建详细教程')
          _, antique_text = read_page('2024/06/14/全国古玩市场大全')

          if '**不良林**' in socks_text:
              raise SystemExit('Socks article still renders literal bold markers around 不良林')
          if '**"主包"**' in disable_text or '**”主包”**' in disable_text:
              raise SystemExit('WordPress update article still renders literal bold markers')
          if '<strong>创建新的子主题</strong>' not in child_raw or '<strong>文件</strong>' not in child_raw:
              raise SystemExit('Child-theme article bold markup did not render as expected')
          if '**' in child_text and ('创建' in child_text or '文件' in child_text):
              raise SystemExit('Child-theme article still exposes malformed bold markers')

          command = 'bash <(wget -qO- -o- https://git.io/v2ray.sh)'
          if v2ray_text.count(command) != 1:
              raise SystemExit(f'V2Ray command count is {v2ray_text.count(command)}, expected 1')
          if '```bash' in v2ray_text:
              raise SystemExit('V2Ray page still renders a Markdown fence literally')
          if '$2.88 起！**' in v2ray_text:
              raise SystemExit('V2Ray price bold marker still leaks into rendered text')
          if '**1、**' in antique_text:
              raise SystemExit('Antique-market article still renders literal bold markers for Hainan item 1')

          print('All five historical paths and generated Markdown assertions passed.')
          PY

      - name: Commit approved article fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'source/_posts/一键转换】将机场节点转换为socks节点，实现一个节点一个端口.md' \
            'source/_posts/全国古玩市场大全.md' \
            'source/_posts/v2ray搭建详细教程.md' \
            'source/_posts/wordpress创建子主题方法.md' \
            'source/_posts/禁用wordpress插件的更新-全部禁用和部分禁用.md'
          git commit -m 'Fix remaining malformed Markdown rendering'

      - name: Remove temporary validation files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/phase19_apply.py .github/workflows/phase-19-validation.yml
          git commit -m 'Remove temporary phase 19 validation files'
          git push origin HEAD:fix/site-quality-phase-19
