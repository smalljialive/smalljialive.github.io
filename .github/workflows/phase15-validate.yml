name: Phase 15 Validation

on:
  push:
    branches:
      - fix/site-quality-phase-15

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply approved Phase 15 edits
        run: python .github/phase15_apply.py apply

      - name: Validate source edits
        run: python .github/phase15_apply.py source

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Clean Hexo output
        run: npx hexo clean

      - name: Generate Hexo site
        run: npx hexo generate

      - name: Validate generated site
        run: python .github/phase15_apply.py generated

      - name: Commit approved edits and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "source/_posts/使用Github+Hexo+Anzhiyu快速搭建个人博客.md" \
            "source/_posts/使用Github制作个人图床.md" \
            "source/_posts/如何在网站中引入一个音乐播放器.md"
          git commit -m "Fix GitHub and music tutorial inconsistencies"
          git rm .github/phase15_apply.py .github/workflows/phase15-validate.yml
          git commit -m "Remove temporary Phase 15 validation helpers"
          git push origin HEAD:fix/site-quality-phase-15
