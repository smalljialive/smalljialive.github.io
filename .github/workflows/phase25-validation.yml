name: Phase 25 Validation

on:
  push:
    branches:
      - fix/site-quality-phase-25

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.event.head_commit.message != 'fix: harden Phase 25 site interactions'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/site-quality-phase-25
          fetch-depth: 0

      - name: Apply exact Phase 25 patch
        run: python .github/scripts/phase25_patch.py

      - name: Verify authorized diff only
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            'source/categories/index-1/index-1.md' \
            'source/categories/index-2/index-2.md' \
            'source/categories/index-3/index-3.md' \
            'themes/anzhiyu/source/js/anzhiyu/right_click_menu.js' \
            'themes/anzhiyu/source/js/main.js' \
            'themes/anzhiyu/source/js/utils.js' | sort)"
          actual="$(git diff --name-only | sort)"
          printf 'Expected changed files:\n%s\n' "$expected"
          printf 'Actual changed files:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check

      - name: Verify JavaScript syntax
        run: |
          node --check themes/anzhiyu/source/js/utils.js
          node --check themes/anzhiyu/source/js/main.js
          node --check themes/anzhiyu/source/js/anzhiyu/right_click_menu.js

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Hexo site
        run: npx hexo generate

      - name: Verify generated regressions
        shell: bash
        run: |
          set -euo pipefail

          # Obsolete manually-created category pages must disappear.
          test ! -e public/categories/index-1/index-1.html
          test ! -e public/categories/index-2/index-2.html
          test ! -e public/categories/index-3/index-3.html

          # Real Hexo category archive pages must remain.
          test -e 'public/categories/运营知识/index.html'
          test -e 'public/categories/代码细节/index.html'
          test -e 'public/categories/生活日常/index.html'

          # Music controls must be guarded while the nav player is not ready.
          grep -F 'const navAplayer = navMusicEl?.querySelector("meting-js")?.aplayer;' public/js/utils.js
          grep -F 'if (!navAplayer)' public/js/utils.js
          grep -F 'const musicName = anzhiyu.musicGetName();' public/js/anzhiyu/right_click_menu.js

          # Duplicate mobile menu anonymous binding must be gone; managed initializer remains.
          if grep -F 'document.getElementById("toggle-menu").addEventListener("click", () => {' public/js/main.js; then
            echo 'duplicate mobile-menu binding still exists' >&2
            exit 1
          fi
          test "$(grep -Fc 'openMobileMenu();' public/js/main.js)" -eq 1

          # Right-menu wheel-close listener must bind once per script lifetime.
          grep -F 'let maskScrollListenersBound = false;' public/js/anzhiyu/right_click_menu.js
          grep -F 'if (maskScrollListenersBound) return;' public/js/anzhiyu/right_click_menu.js

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            source/categories/index-1/index-1.md \
            source/categories/index-2/index-2.md \
            source/categories/index-3/index-3.md \
            themes/anzhiyu/source/js/utils.js \
            themes/anzhiyu/source/js/main.js \
            themes/anzhiyu/source/js/anzhiyu/right_click_menu.js
          git commit -m 'fix: harden Phase 25 site interactions'
          git push origin HEAD:fix/site-quality-phase-25
