name: Phase 11 Validation

on:
  push:
    branches:
      - fix/site-quality-phase-11

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Generate Hexo site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Validate generated output
        shell: bash
        run: |
          set -euo pipefail

          html_count=$(find public -type f -name '*.html' | wc -l)
          total_count=$(find public -type f | wc -l)
          echo "Generated HTML files: ${html_count}"
          echo "Generated total files: ${total_count}"

          test "${html_count}" -gt 0
          test "${total_count}" -gt 0

          grep -R -F 'href="https://curl.se/ca/cacert.pem"' public >/dev/null
          if grep -R -F 'https://www.google.com/search?q=https://curl.se/ca/cacert.pem' public >/dev/null; then
            echo "Old Google-wrapped cacert.pem link is still present."
            exit 1
          fi

          grep -R -F '分类法' public >/dev/null
          grep -R -F '滚动到ID的偏移量' public >/dev/null
          grep -R -F '保存好的内容转换为本地socks节点' public >/dev/null

          for old_text in '分类伐' '混动到ID' '保存好的的内容'; do
            if grep -R -F "${old_text}" public >/dev/null; then
              echo "Old text is still present: ${old_text}"
              exit 1
            fi
          done

      - name: Remove temporary validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase-11-validation.yml
          git commit -m "Remove temporary phase 11 validation workflow"
          git push
