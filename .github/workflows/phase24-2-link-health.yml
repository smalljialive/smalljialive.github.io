name: Phase 24.2 Link Health Validation

on:
  push:
    branches:
      - fix/link-health-phase-24-2
    paths:
      - .github/workflows/phase24-2-link-health.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/link-health-phase-24-2
          fetch-depth: 0

      - name: Apply confirmed link upgrades
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('source/_data/link.yml')
          data = path.read_bytes()

          replacements = [
              (b'http://www.yuetingba.cn/', b'https://www.yuetingba.cn/'),
              (b'http://www.gfxcamp.com/', b'https://www.gfxcamp.com/'),
              (b'http://www.lookae.com/', b'https://www.lookae.com/'),
              (b'http://c4dsky.com/', b'https://c4dsky.com/'),
              (b'http://music.2t58.com/', b'https://www.2t58.com/'),
              (b'http://weavesilk.com/', b'https://weavesilk.com/'),
          ]

          for old, new in replacements:
              count = data.count(old)
              if count != 2:
                  raise SystemExit(f'Expected exactly 2 occurrences of {old!r} (link + favicon), found {count}')
              data = data.replace(old, new)

          path.write_bytes(data)
          PY

      - name: Validate exact source diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "source/_data/link.yml"
          git -c core.whitespace=cr-at-eol diff --check

          grep -Fq 'link: https://www.yuetingba.cn/' source/_data/link.yml
          grep -Fq 'avatar: https://www.yuetingba.cn/favicon.ico' source/_data/link.yml
          grep -Fq 'link: https://www.gfxcamp.com/' source/_data/link.yml
          grep -Fq 'avatar: https://www.gfxcamp.com/favicon.ico' source/_data/link.yml
          grep -Fq 'link: https://www.lookae.com/' source/_data/link.yml
          grep -Fq 'avatar: https://www.lookae.com/favicon.ico' source/_data/link.yml
          grep -Fq 'link: https://c4dsky.com/' source/_data/link.yml
          grep -Fq 'avatar: https://c4dsky.com/favicon.ico' source/_data/link.yml
          grep -Fq 'link: https://www.2t58.com/' source/_data/link.yml
          grep -Fq 'avatar: https://www.2t58.com/favicon.ico' source/_data/link.yml
          grep -Fq 'link: https://weavesilk.com/' source/_data/link.yml
          grep -Fq 'avatar: https://weavesilk.com/favicon.ico' source/_data/link.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static pages
        run: npm run build

      - name: Validate generated link page
        shell: bash
        run: |
          set -euo pipefail
          page='public/link/index.html'
          test -f "$page"

          grep -Fq 'https://www.yuetingba.cn/' "$page"
          grep -Fq 'https://www.gfxcamp.com/' "$page"
          grep -Fq 'https://www.lookae.com/' "$page"
          grep -Fq 'https://c4dsky.com/' "$page"
          grep -Fq 'https://www.2t58.com/' "$page"
          grep -Fq 'https://weavesilk.com/' "$page"

          ! grep -Fq 'http://www.yuetingba.cn/' "$page"
          ! grep -Fq 'http://www.gfxcamp.com/' "$page"
          ! grep -Fq 'http://www.lookae.com/' "$page"
          ! grep -Fq 'http://c4dsky.com/' "$page"
          ! grep -Fq 'http://music.2t58.com/' "$page"
          ! grep -Fq 'http://weavesilk.com/' "$page"

      - name: Commit link data change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/_data/link.yml
          git commit -m 'Upgrade confirmed legacy links to HTTPS'
          git push origin HEAD:fix/link-health-phase-24-2
