name: Deploy Meting Experimental Worker (Manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_TEST_WORKER to deploy only smalljia-meting-experiment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-smalljia-meting-experiment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_TEST_WORKER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned experimental code (not website production branch)
        uses: actions/checkout@v4
        with:
          repository: smalljialive/smalljialive.github.io
          ref: 4d307855167e2083eb896e32de0a70262b74d4af
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare secrets exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Install isolated Meting Worker dependencies
        working-directory: workers/meting-experiment
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify diagnostic source syntax
        working-directory: workers/meting-experiment
        run: |
          node --check src/index.js
          grep -q 'EMPTY_UPSTREAM_LIST' src/index.js
          grep -q 'UPSTREAM_ERROR_OR_TIMEOUT' src/index.js
          grep -q 'PROVIDER_REQUEST_FAILED' src/index.js
          grep -q 'PROVIDER_HTTP_ERROR' src/index.js
      - name: Verify fixed deployment target
        working-directory: workers/meting-experiment
        run: |
          grep -qx 'name = "smalljia-meting-experiment"' wrangler.toml
          test -f src/index.js
      - name: Deploy isolated test Worker only
        working-directory: workers/meting-experiment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Deployment summary
        run: |
          echo "Only **smalljia-meting-experiment** was targeted." >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: \`4d307855167e2083eb896e32de0a70262b74d4af\`." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow does not publish Hexo or merge PR #46." >> "$GITHUB_STEP_SUMMARY"
