name: Phase 16 Validation

on:
  push:
    branches:
      - fix/site-quality-phase-16

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply approved Phase 16 edits
        run: python .github/phase16_apply.py

      - name: Validate source edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'themes/anzhiyu/source/js/search/local-search.js',
              'themes/anzhiyu/layout/includes/pagination.pug',
              'themes/anzhiyu/source/js/main.js',
          }
          output = subprocess.check_output(
              ['git', '-c', 'core.quotePath=false', 'diff', '--name-only'], text=True
          )
          actual = {line.strip() for line in output.splitlines() if line.strip()}
          assert actual == expected, f'unexpected changed files: {actual ^ expected}'

          local = Path('themes/anzhiyu/source/js/search/local-search.js').read_text(encoding='utf-8')
          assert 'const handleSearchEscape = event =>' in local
          assert 'document.addEventListener("keydown", function f' not in local
          assert local.count('document.addEventListener("keydown", handleSearchEscape);') == 1
          assert local.count('document.removeEventListener("keydown", handleSearchEscape);') == 2

          pagination = Path('themes/anzhiyu/layout/includes/pagination.pug').read_text(encoding='utf-8')
          assert 'onkeyup=' not in pagination
          assert 'oninput="value=value.replace(/[^0-9]/g,\'\')"' in pagination

          main = Path('themes/anzhiyu/source/js/main.js').read_text(encoding='utf-8')
          assert 'const copied = document.execCommand("copy");' in main
          assert 'copied ? GLOBAL_CONFIG.copy.success : GLOBAL_CONFIG.copy.error' in main
          assert 'console.error("复制代码失败:", error);' in main
          assert 'const href = link ? link.getAttribute("href") : "";' in main
          assert 'if (!href || href.startsWith("javascript:")) return;' in main
          assert 'var href = link.href;' not in main
          PY
          node --check themes/anzhiyu/source/js/search/local-search.js
          node --check themes/anzhiyu/source/js/main.js
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Clean Hexo output
        run: npx hexo clean

      - name: Generate Hexo site
        run: npx hexo generate

      - name: Validate generated site
        run: |
          python - <<'PY'
          from pathlib import Path

          html_files = list(Path('public').rglob('*.html'))
          all_files = [p for p in Path('public').rglob('*') if p.is_file()]
          print(f'Generated HTML files: {len(html_files)}')
          print(f'Generated total files: {len(all_files)}')
          assert len(html_files) == 138, len(html_files)
          assert len(all_files) == 167, len(all_files)

          index = Path('public/index.html').read_text(encoding='utf-8')
          assert 'id="toPageText"' in index
          assert 'oninput="value=value.replace(/[^0-9]/g,\'\')"' in index
          assert 'onkeyup=' not in index[index.index('id="toPageText"') - 100:index.index('id="toPageText"') + 300]

          local = Path('public/js/search/local-search.js').read_text(encoding='utf-8')
          assert 'handleSearchEscape' in local
          assert 'document.addEventListener("keydown", function f' not in local

          main = Path('public/js/main.js').read_text(encoding='utf-8')
          assert 'const copied = document.execCommand("copy");' in main
          assert 'GLOBAL_CONFIG.copy.error' in main
          assert 'href.startsWith("javascript:")' in main
          PY

      - name: Commit approved edits and remove helpers
        run: |
          git config user.name "Small Jia"
          git config user.email "mortysmithfor@gmail.com"
          git add themes/anzhiyu/source/js/search/local-search.js themes/anzhiyu/layout/includes/pagination.pug themes/anzhiyu/source/js/main.js
          git rm .github/phase16_apply.py .github/workflows/phase16-validate.yml
          git diff --cached --check
          git commit -m "Fix active search and pagination interactions"
          git push origin HEAD:fix/site-quality-phase-16
