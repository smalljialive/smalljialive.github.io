name: Phase 27 Structure Cleanup Validation

on:
  push:
    branches:
      - fix/phase-27-structure-cleanup

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/phase-27-structure-cleanup
          fetch-depth: 0

      - name: Apply exact Phase 27 patch
        run: python3 .github/scripts/phase-27-patch.py

      - name: Verify authorized diff only
        shell: bash
        run: |
          git diff --check
          mapfile -t files < <(git diff --name-only | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 7
          test "${files[0]}" = "themes/anzhiyu/layout/includes/footer.pug"
          test "${files[1]}" = "themes/anzhiyu/layout/includes/layout.pug"
          test "${files[2]}" = "themes/anzhiyu/layout/includes/post/post-copyright.pug"
          test "${files[3]}" = "themes/anzhiyu/layout/includes/post/ptool.pug"
          test "${files[4]}" = "themes/anzhiyu/source/js/anzhiyu/right_click_menu.js"
          test "${files[5]}" = "themes/anzhiyu/source/js/main.js"
          test "${files[6]}" = "themes/anzhiyu/source/js/utils.js"

      - name: Check JavaScript syntax
        run: |
          node --check themes/anzhiyu/source/js/utils.js
          node --check themes/anzhiyu/source/js/main.js
          node --check themes/anzhiyu/source/js/anzhiyu/right_click_menu.js

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate site
        run: npx hexo clean && npx hexo generate

      - name: Validate generated structure
        run: python3 .github/scripts/phase-27-validate.py

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/anzhiyu/layout/includes/footer.pug
          git add themes/anzhiyu/layout/includes/layout.pug
          git add themes/anzhiyu/layout/includes/post/post-copyright.pug
          git add themes/anzhiyu/layout/includes/post/ptool.pug
          git add themes/anzhiyu/source/js/anzhiyu/right_click_menu.js
          git add themes/anzhiyu/source/js/main.js
          git add themes/anzhiyu/source/js/utils.js
          git commit -m "fix: clean inactive UI structure and copy helper [skip ci]"
          git push origin HEAD:fix/phase-27-structure-cleanup
