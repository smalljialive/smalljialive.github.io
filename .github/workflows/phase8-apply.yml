name: Phase 8 Apply and Validate

on:
  push:
    branches:
      - fix/site-quality-phase-8

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/site-quality-phase-8
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply phase 8 fixes
        run: python3 .github/phase8_apply.py

      - name: JavaScript syntax checks
        run: |
          node --check themes/anzhiyu/source/js/utils.js
          node --check themes/anzhiyu/source/js/anzhiyu/right_click_menu.js

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Build Hexo site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Validate generated output
        run: |
          test -f public/music/index.html
          test -f public/js/utils.js
          test -f public/js/anzhiyu/right_click_menu.js
          grep -q 'replaceChildren(meting)' public/js/utils.js
          grep -q 'Math.min(1' public/js/utils.js
          grep -q 'Math.max(0' public/js/utils.js
          grep -q 'musicPageKeydownHandler' public/js/utils.js
          grep -q 'isContentEditable' public/js/utils.js
          grep -q 'maxAttempts = 100' public/js/utils.js
          ! grep -q 'type="playlist" type="playlist"' public/js/utils.js
          ! grep -Fq 'server=${server}' public/js/utils.js
          grep -q 'closest?.("a\[href\]")' public/js/anzhiyu/right_click_menu.js
          grep -q 'await copyImage(imgsrc)' public/js/anzhiyu/right_click_menu.js
          grep -q 'img.onerror' public/js/anzhiyu/right_click_menu.js
          grep -q 'await navigator.clipboard.write' public/js/anzhiyu/right_click_menu.js

      - name: Commit validated fixes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase8-apply.yml .github/phase8_apply.py
          git add themes/anzhiyu/source/js/utils.js themes/anzhiyu/source/js/anzhiyu/right_click_menu.js
          git commit -m "fix: harden music and right-click interactions [phase8-applied]"
          git push origin fix/site-quality-phase-8
