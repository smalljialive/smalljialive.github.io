name: Apply Qexo Essay Fix

on:
  push:
    branches:
      - hexo
    paths:
      - .github/workflows/qexo-apply-fix.yml
      - scripts/apply-qexo-fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch Qexo bridge
        run: python scripts/apply-qexo-fix.py

      - name: Validate bridge JavaScript
        run: node --check themes/anzhiyu/source/js/smalljia-essay-qexo.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/anzhiyu/source/js/smalljia-essay-qexo.js themes/anzhiyu/layout/page.pug
          git diff --cached --check
          git commit -m "fix(essay): repair Qexo live talks bridge"
          git push origin HEAD:hexo
