name: Phase 26 validation

on:
  push:
    branches:
      - fix/cdn-cleanup-phase-26

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/cdn-cleanup-phase-26
          fetch-depth: 0

      - name: Apply exact Phase 26 patch
        run: python .github/scripts/phase26_patch.py

      - name: Verify authorized source diff
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            '_config.anzhiyu.yml' \
            'themes/anzhiyu/layout/includes/additional-js.pug' \
            'themes/anzhiyu/layout/includes/top/top.pug')
          actual=$(git diff --name-only | sort)
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected modified files:'
            git diff --name-only
            exit 1
          fi
          git diff --check

      - name: Probe replacement CDN resources
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://cdn.jsdelivr.net/npm/anzhiyu-theme-static@1.0.0/swiper/swiper.min.css'
            'https://cdn.jsdelivr.net/npm/anzhiyu-theme-static@1.0.0/swiper/swiper.min.js'
            'https://cdn.jsdelivr.net/npm/anzhiyu-theme-static@1.0.0/dark/dark.js'
            'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 45 -o /dev/null "$url"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static pages
        run: npx hexo generate

      - name: Verify generated homepage and post
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html

          grep -F 'https://cdn.jsdelivr.net/npm/anzhiyu-theme-static@1.0.0/swiper/swiper.min.css' public/index.html >/dev/null
          grep -F 'https://cdn.jsdelivr.net/npm/anzhiyu-theme-static@1.0.0/swiper/swiper.min.js' public/index.html >/dev/null
          grep -F 'https://cdn.jsdelivr.net/npm/anzhiyu-theme-static@1.0.0/dark/dark.js' public/index.html >/dev/null

          if grep -F 'npm.elemecdn.com/anzhiyu-theme-static@1.0.0/swiper/' public/index.html >/dev/null; then
            echo 'Old ElemeCDN Swiper reference remains on homepage'
            exit 1
          fi
          if grep -F 'npm.elemecdn.com/anzhiyu-theme-static@1.0.0/dark/dark.js' public/index.html >/dev/null; then
            echo 'Old ElemeCDN dark.js reference remains on homepage'
            exit 1
          fi
          if grep -F 'lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/qrcodejs/' public/index.html >/dev/null; then
            echo 'Old ByteDance QRCode reference remains on homepage'
            exit 1
          fi
          if grep -F 'qrcodejs@1.0.0/qrcode.min.js' public/index.html >/dev/null; then
            echo 'QRCode script should not load on homepage'
            exit 1
          fi
          if grep -F '<link rel="stylesheet">' public/index.html >/dev/null; then
            echo 'Empty stylesheet tag still generated on homepage'
            exit 1
          fi

          POST_HTML="$(find public -path '*/20*/*/index.html' -type f -print -quit)"
          test -n "$POST_HTML"
          echo "Checking post: $POST_HTML"
          grep -F 'id="qrcode"' "$POST_HTML" >/dev/null
          grep -F 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js' "$POST_HTML" >/dev/null
          if grep -F 'lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/qrcodejs/' "$POST_HTML" >/dev/null; then
            echo 'Old ByteDance QRCode reference remains on post'
            exit 1
          fi

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'smalljialive'
          git config user.email 'smalljialive@users.noreply.github.com'
          git add _config.anzhiyu.yml themes/anzhiyu/layout/includes/additional-js.pug themes/anzhiyu/layout/includes/top/top.pug
          git commit -m 'Phase 26: consolidate active third-party assets [skip ci]'
          git push origin HEAD:fix/cdn-cleanup-phase-26
