name: Apply Nav Music Stable Start Patch

on:
  push:
    branches:
      - hexo
    paths:
      - .github/workflows/nav-music-stable-start-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch nav music startup
        shell: python
        run: |
          from pathlib import Path

          player = Path("themes/anzhiyu/source/js/smalljia-nav-daily-player.js")
          text = player.read_text(encoding="utf-8")
          replacements = [
              ('const VERSION = "20260911-1";', 'const VERSION = "20260911-2";'),
              ('const startIndex = Math.floor(Math.random() * state.tracks.length);', 'const startIndex = 0;'),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one match in {player}: {old!r}, found {text.count(old)}")
              text = text.replace(old, new, 1)
          player.write_text(text, encoding="utf-8", newline="\n")

          music = Path("themes/anzhiyu/layout/includes/music.pug")
          text = music.read_text(encoding="utf-8")
          old = 'order="random"'
          new = 'order="list"'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one nav music order match, found {text.count(old)}")
              text = text.replace(old, new, 1)
          music.write_text(text, encoding="utf-8", newline="\n")

          additional = Path("themes/anzhiyu/layout/includes/additional-js.pug")
          text = additional.read_text(encoding="utf-8")
          old = "smalljia-nav-daily-player.js') + '?v=20260911-1'"
          new = "smalljia-nav-daily-player.js') + '?v=20260911-2'"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one cache-version match, found {text.count(old)}")
              text = text.replace(old, new, 1)
          additional.write_text(text, encoding="utf-8", newline="\n")

      - name: Validate nav player
        run: node --check themes/anzhiyu/source/js/smalljia-nav-daily-player.js

      - name: Commit patch
        run: |
          if git diff --quiet -- themes/anzhiyu/source/js/smalljia-nav-daily-player.js themes/anzhiyu/layout/includes/music.pug themes/anzhiyu/layout/includes/additional-js.pug; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/anzhiyu/source/js/smalljia-nav-daily-player.js themes/anzhiyu/layout/includes/music.pug themes/anzhiyu/layout/includes/additional-js.pug
          git commit -m "fix(nav-music): start Daily playlist sequentially"
          git push origin HEAD:hexo
