name: Phase 18 Validation

on:
  push:
    branches:
      - fix/site-quality-phase-18

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/site-quality-phase-18
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply approved Phase 18 edits
        run: python .github/phase18_apply.py

      - name: Validate source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pug = Path('themes/anzhiyu/layout/includes/anzhiyu/console.pug').read_text(encoding='utf-8')
          css = Path('themes/anzhiyu/source/css/_extra/console/console.css').read_text(encoding='utf-8')
          js = Path('themes/anzhiyu/source/js/utils.js').read_text(encoding='utf-8')

          checks = {
              'newest comments parent conditional': "if theme.newest_comments.enable\n      .console-card-group-left" in pug,
              'newest comments partial retained': "!=partial('includes/widget/card_newest_comment', {}, {cache: true})" in pug,
              'single console column fills width': '#console .console-card-group-right:only-child' in css and 'width: 100%;' in css,
              'music player readiness uses optional chaining': 'const navAplayer = navMeting?.aplayer;' in js,
              'music loading feedback exists': js.count('音乐播放器加载中，请稍后重试') == 2,
              'music binding reports readiness': 'if (!musicTitle || !musicButton) return false;' in js and 'return true;' in js,
              'safe stored player toggle': 'if (changePaly) navAplayer.toggle();' in js,
              'music list null guard': 'if (!aplayerList) return;' in js,
              'unsafe direct toggle removed': 'document.querySelector("#nav-music meting-js").aplayer.toggle()' not in js,
              'unsafe music title binding removed': 'document.querySelector("#nav-music .aplayer-music").addEventListener' not in js,
              'unsafe music button binding removed': 'document.querySelector("#nav-music .aplayer-button").addEventListener' not in js,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Source validation failed: ' + ', '.join(failed))
          print('Source assertions passed')
          PY
          node --check themes/anzhiyu/source/js/utils.js
          git diff --check
          mapfile -t changed < <(git -c core.quotePath=false diff --name-only)
          printf 'Changed after apply:\n%s\n' "${changed[@]}"
          expected=(
            'themes/anzhiyu/layout/includes/anzhiyu/console.pug'
            'themes/anzhiyu/source/css/_extra/console/console.css'
            'themes/anzhiyu/source/js/utils.js'
          )
          if [ "${#changed[@]}" -ne 3 ]; then
            echo "Expected exactly 3 modified source files"
            exit 1
          fi
          for i in "${!expected[@]}"; do
            if [ "${changed[$i]}" != "${expected[$i]}" ]; then
              echo "Unexpected changed file order/content: ${changed[$i]}"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Clean Hexo output
        run: npx hexo clean

      - name: Generate Hexo site
        run: npx hexo generate

      - name: Validate generated site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [p for p in Path('public').rglob('*') if p.is_file()]
          html = [p for p in files if p.suffix.lower() == '.html']
          print(f'Generated files: {len(files)} total / {len(html)} HTML')
          if len(files) != 167:
              raise SystemExit(f'Expected 167 generated files, found {len(files)}')
          if len(html) != 138:
              raise SystemExit(f'Expected 138 HTML files, found {len(html)}')

          index = Path('public/index.html').read_text(encoding='utf-8')
          if 'class="console-card-group-left"' in index:
              raise SystemExit('Disabled newest-comments console column is still generated')
          if 'class="console-card-group-right"' not in index:
              raise SystemExit('Console right column is missing')

          css = Path('public/css/index.css').read_text(encoding='utf-8')
          if '.console-card-group-right:only-child' not in css:
              raise SystemExit('Generated CSS is missing single-column console rule')

          utils = Path('public/js/utils.js').read_text(encoding='utf-8')
          required = [
              'const navAplayer = navMeting?.aplayer;',
              '音乐播放器加载中，请稍后重试',
              'if (!musicTitle || !musicButton) return false;',
              'if (changePaly) navAplayer.toggle();',
              'if (!aplayerList) return;',
          ]
          missing = [item for item in required if item not in utils]
          if missing:
              raise SystemExit('Generated utils.js missing: ' + repr(missing))
          forbidden = [
              'document.querySelector("#nav-music meting-js").aplayer.toggle()',
              'document.querySelector("#nav-music .aplayer-music").addEventListener',
              'document.querySelector("#nav-music .aplayer-button").addEventListener',
          ]
          found = [item for item in forbidden if item in utils]
          if found:
              raise SystemExit('Generated utils.js still contains unsafe music access: ' + repr(found))
          print('Generated-site assertions passed')
          PY

      - name: Commit approved edits and remove helpers
        shell: bash
        run: |
          git config user.name "Small Jia"
          git config user.email "mortysmithfor@gmail.com"
          git add \
            themes/anzhiyu/layout/includes/anzhiyu/console.pug \
            themes/anzhiyu/source/css/_extra/console/console.css \
            themes/anzhiyu/source/js/utils.js
          git rm .github/phase18_apply.py .github/workflows/phase18-validate.yml
          git commit -m "Fix console layout and music readiness guards"
          git push origin HEAD:fix/site-quality-phase-18
