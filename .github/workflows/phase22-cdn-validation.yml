name: Phase 22 CDN Provider Validation

on:
  push:
    branches:
      - fix/cdn-provider-phase-22
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/cdn-provider-phase-22
          fetch-depth: 0

      - name: Apply CDN provider change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('_config.anzhiyu.yml')
          text = path.read_text(encoding='utf-8')
          old = '  third_party_provider: cbd\n'
          new = '  third_party_provider: jsdelivr\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one provider setting, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate source diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "_config.anzhiyu.yml"
          grep -q '^  third_party_provider: jsdelivr$' _config.anzhiyu.yml
          ! grep -q '^  third_party_provider: cbd$' _config.anzhiyu.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static pages
        run: npm run build

      - name: Validate generated CDN URLs
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/music/index.html
          POST_HTML="$(find public -path '*/20*/*/index.html' -type f -print -quit)"
          test -n "$POST_HTML"

          for html in public/index.html public/music/index.html "$POST_HTML"; do
            ! grep -q 'cdn.cbd.int' "$html"
            grep -q 'cdn.jsdelivr.net/npm/pjax@0.2.8/pjax.min.js' "$html"
            grep -q 'cdn.jsdelivr.net/npm/@fancyapps/ui@5.0.28/dist/fancybox/fancybox.umd.js' "$html"
            grep -q 'cdn.jsdelivr.net/npm/node-snackbar@0.1.16/dist/snackbar.min.js' "$html"
            grep -q 'cdn.jsdelivr.net/npm/anzhiyu-blog-static@1.0.1/js/APlayer.min.js' "$html"
            grep -q 'cdn.jsdelivr.net/npm/hexo-anzhiyu-music@1.0.1/assets/js/Meting2.min.js' "$html"
          done

          grep -q 'cdn.jsdelivr.net/npm/butterfly-extsrc@1.1.3/sharejs/dist/js/social-share.min.js' "$POST_HTML"
          grep -q 'cdn.jsdelivr.net/npm/pace-js@1.2.4/pace.min.js' public/index.html

      - name: Probe critical jsDelivr resources
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://cdn.jsdelivr.net/npm/pjax@0.2.8/pjax.min.js'
            'https://cdn.jsdelivr.net/npm/anzhiyu-blog-static@1.0.1/js/APlayer.min.js'
            'https://cdn.jsdelivr.net/npm/hexo-anzhiyu-music@1.0.1/assets/js/Meting2.min.js'
            'https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0.28/dist/fancybox/fancybox.umd.js'
            'https://cdn.jsdelivr.net/npm/node-snackbar@0.1.16/dist/snackbar.min.js'
            'https://cdn.jsdelivr.net/npm/pace-js@1.2.4/pace.min.js'
            'https://cdn.jsdelivr.net/npm/butterfly-extsrc@1.1.3/sharejs/dist/js/social-share.min.js'
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -fsSL --range 0-64 -o /dev/null "$url"
          done

      - name: Commit Phase 22 change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _config.anzhiyu.yml
          git commit -m 'fix: move third-party assets to jsDelivr'
          git push origin HEAD:fix/cdn-provider-phase-22
