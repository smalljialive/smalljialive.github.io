name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - hexo
  schedule:
    # GitHub Actions cron uses UTC. 16:00 UTC = 00:00 UTC+8 (China/Singapore).
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: hexo-pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout blog source
        uses: actions/checkout@v6
        with:
          path: blog

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./blog

      - name: Generate static pages
        run: |
          npx hexo generate
          test -s public/css/index.css
          grep -q ".sjm-playerbar" public/css/index.css
          grep -q ".sjm-fullscreen" public/css/index.css
          grep -q ".sjm-discover-card" public/css/index.css
          grep -q ".sjm-custom-playlist-grid" public/css/index.css
          grep -q ".sjm-source-select-wrap" public/css/index.css
          grep -q ".sjm-source-trigger" public/css/index.css
          grep -q ".sjm-source-menu" public/css/index.css
          test -s public/js/smalljia-music-native.js
          test -s public/js/smalljia-music-gdstudio.js
          test -s public/js/smalljia-music-personal-playlist.js
          test -s public/js/smalljia-music-library.js
          test -s public/js/smalljia-music-daily-import.js
          test -s public/js/smalljia-music-fullscreen.js
          test -s public/js/smalljia-music-scrollfix.js
          test -s public/js/smalljia-music-source-selector.js
          test -s public/js/smalljia-music-source-retry.js
          test -s public/js/smalljia-music-source-compat.js
          test -s public/js/smalljia-music-interactions.js
          test -s public/js/smalljia-nav-daily-player.js
          test -s public/js/smalljia-link-nav-player-fix.js
          test -s public/img/music-placeholder.svg
          node --check public/js/smalljia-music-native.js
          node --check public/js/smalljia-music-gdstudio.js
          node --check public/js/smalljia-music-personal-playlist.js
          node --check public/js/smalljia-music-library.js
          node --check public/js/smalljia-music-daily-import.js
          node --check public/js/smalljia-music-fullscreen.js
          node --check public/js/smalljia-music-scrollfix.js
          node --check public/js/smalljia-music-source-selector.js
          node --check public/js/smalljia-music-source-retry.js
          node --check public/js/smalljia-music-source-compat.js
          node --check public/js/smalljia-music-interactions.js
          node --check public/js/smalljia-nav-daily-player.js
          node --check public/js/smalljia-link-nav-player-fix.js
          grep -q "SmallJiaNativeMusic" public/js/smalljia-music-native.js
          grep -q "music-api.gdstudio.xyz/api.php" public/js/smalljia-music-gdstudio.js
          grep -q "music-proxy.gdstudio.org" public/js/smalljia-music-gdstudio.js
          grep -q "hydrateSearchCovers" public/js/smalljia-music-gdstudio.js
          grep -q 'switchView("home")' public/js/smalljia-music-gdstudio.js
          grep -q "smalljia-music-proxy-small-jias-projects.vercel.app/api/music" public/js/smalljia-music-gdstudio.js
          grep -q "smalljia_music_personal_catalog_matches_v1" public/js/smalljia-music-personal-playlist.js
          grep -q '"name":"盛夏的告别"' public/js/smalljia-music-personal-playlist.js
          grep -q '"name":"情歌 (Live)"' public/js/smalljia-music-personal-playlist.js
          grep -q "personal-97" public/js/smalljia-music-personal-playlist.js
          grep -q "smalljia_music_custom_playlists_v1" public/js/smalljia-music-library.js
          grep -q "sjm-row-playlist-remove" public/js/smalljia-music-library.js
          grep -q "3778678" public/js/smalljia-music-library.js
          grep -q "3779629" public/js/smalljia-music-library.js
          grep -q "19723756" public/js/smalljia-music-library.js
          grep -q "2884035" public/js/smalljia-music-library.js
          grep -q "连续随机" public/js/smalljia-music-library.js
          grep -q "smalljia_music_queue_to_daily_v1" public/js/smalljia-music-daily-import.js
          grep -q 'TARGET_NAME = "日常"' public/js/smalljia-music-daily-import.js
          grep -q "sjm-web-fullscreen-open" public/js/smalljia-music-fullscreen.js
          grep -q "open(\"screen\")" public/js/smalljia-music-fullscreen.js
          grep -q "scrollInside" public/js/smalljia-music-scrollfix.js
          grep -q "scrollIntoView" public/js/smalljia-music-scrollfix.js
          grep -q "smalljia_music_source_preference_v1" public/js/smalljia-music-source-selector.js
          grep -q 'value: "tencent"' public/js/smalljia-music-source-selector.js
          grep -q "findPlayableMatch" public/js/smalljia-music-source-selector.js
          grep -q "自动检查多个音源" public/js/smalljia-music-source-retry.js
          grep -q "CACHE_TTL" public/js/smalljia-music-source-retry.js
          grep -q "findTencentMatch" public/js/smalljia-music-source-compat.js
          grep -q "music-proxy.gdstudio.org" public/js/smalljia-music-source-compat.js
          grep -q "removeKugouUi" public/js/smalljia-music-source-compat.js
          grep -q "sjm-row-actions-cluster" public/js/smalljia-music-interactions.js
          grep -q 'event.code !== "Space"' public/js/smalljia-music-interactions.js
          grep -q "app.togglePlay" public/js/smalljia-music-interactions.js
          grep -q "sjm-source-trigger" public/js/smalljia-music-interactions.js
          grep -q "sjm-volume-value" public/js/smalljia-music-interactions.js
          grep -q 'TARGET_NAME = "日常"' public/js/smalljia-nav-daily-player.js
          grep -q 'const SOURCES = \["kuwo", "tencent", "netease"\]' public/js/smalljia-nav-daily-player.js
          grep -q "is_public=eq.true" public/js/smalljia-nav-daily-player.js
          grep -Eq 'smalljia-nav-daily-player\.js\?v=[^" ]+' public/index.html
          grep -Eq 'smalljia-link-nav-player-fix\.js\?v=[^" ]+' public/link/index.html
          grep -q 'window.__smallJiaLinkMusicConfig' public/link/index.html
          if grep -Eq '<script[^>]+src="[^"]*smalljia-nav-(daily-player|music-hover|music-persistence)\.js' public/link/index.html; then
            echo "Link page is eagerly loading nav music runtime; expected click-to-load mode"
            exit 1
          fi
          grep -q "smalljia-music-native.js?v=20260910-1" public/music/index.html
          grep -q "smalljia-music-gdstudio.js?v=20260910-6" public/music/index.html
          grep -q "smalljia-music-personal-playlist.js?v=20260910-1" public/music/index.html
          grep -q "smalljia-music-library.js?v=20260910-1" public/music/index.html
          grep -q "smalljia-music-daily-import.js?v=20260910-1" public/music/index.html
          grep -q "smalljia-music-fullscreen.js?v=20260910-2" public/music/index.html
          grep -q "smalljia-music-scrollfix.js?v=20260910-1" public/music/index.html
          grep -q "smalljia-music-source-selector.js?v=20260910-1" public/music/index.html
          grep -q "smalljia-music-source-retry.js?v=20260910-1" public/music/index.html
          grep -q "smalljia-music-source-compat.js?v=20260910-1" public/music/index.html
          grep -q "smalljia-music-interactions.js?v=20260910-2" public/music/index.html
          grep -q 'id="sjm-volume-value"' public/music/index.html
          grep -q "我的 97 首歌单" public/music/index.html
          grep -q "QQ音乐" public/music/index.html
          grep -q "多音源" public/music/index.html
          grep -q "网页全屏" public/music/index.html
          grep -q "屏幕全屏" public/music/index.html
          grep -q "GD-Studio" public/music/index.html
          if grep -q "anMusic-page-meting" public/music/index.html; then
            echo "Legacy hidden Meting engine is still present in music page"
            exit 1
          fi
        working-directory: ./blog

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./blog/public
          publish_branch: main
