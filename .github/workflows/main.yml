name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - hexo

concurrency:
  group: hexo-pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout blog source
        uses: actions/checkout@v6
        with:
          path: blog

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./blog

      - name: Generate static pages
        run: |
          npx hexo generate
          test -s public/css/index.css
          grep -q ".sjm-playerbar" public/css/index.css
          grep -q ".sjm-fullscreen" public/css/index.css
          test -s public/js/smalljia-music-native.js
          test -s public/js/smalljia-music-gdstudio.js
          test -s public/js/smalljia-music-fullscreen.js
          node --check public/js/smalljia-music-native.js
          node --check public/js/smalljia-music-gdstudio.js
          node --check public/js/smalljia-music-fullscreen.js
          grep -q "SmallJiaNativeMusic" public/js/smalljia-music-native.js
          grep -q "music-api.gdstudio.xyz/api.php" public/js/smalljia-music-gdstudio.js
          grep -q "smalljia-music-proxy-small-jias-projects.vercel.app/api/music" public/js/smalljia-music-gdstudio.js
          grep -q "sjm-web-fullscreen-open" public/js/smalljia-music-fullscreen.js
          grep -q "open(\"screen\")" public/js/smalljia-music-fullscreen.js
          grep -q "smalljia-music-native.js?v=20260910-1" public/music/index.html
          grep -q "smalljia-music-gdstudio.js?v=20260910-3" public/music/index.html
          grep -q "smalljia-music-fullscreen.js?v=20260910-2" public/music/index.html
          grep -q "网页全屏" public/music/index.html
          grep -q "屏幕全屏" public/music/index.html
          grep -q "GD-Studio" public/music/index.html
          if grep -q "anMusic-page-meting" public/music/index.html; then
            echo "Legacy hidden Meting engine is still present in music page"
            exit 1
          fi
        working-directory: ./blog

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./blog/public
          publish_branch: main
