name: Apply phase 2 site quality fixes

on:
  push:
    branches:
      - fix/site-quality-phase-2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/site-quality-phase-2

      - name: Apply exact replacements
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, replacements):
              p = Path(path)
              data = p.read_bytes()
              for old, new, expected in replacements:
                  old_b = old.encode('utf-8')
                  new_b = new.encode('utf-8')
                  count = data.count(old_b)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
                  data = data.replace(old_b, new_b)
              p.write_bytes(data)

          replace_exact('_config.anzhiyu.yml', [
              ('newest_comments:\n  enable: true', 'newest_comments:\n  enable: false', 1),
          ])

          replace_exact('source/_data/link.yml', [
              ('name: Shutterstock图片库', 'name: Gratisography 图片库', 1),
              ('descr: Shutterstock图片素材大全', 'descr: Gratisography 免费创意图片素材', 1),
              ('name: CCO图片搜索', 'name: CC0 图片搜索', 1),
              ('descr: CCO图片搜索，各类图片在线搜索', 'descr: CC0 图片搜索，各类图片在线搜索', 1),
              ('name: Pexel图片库', 'name: Pexels 图片库', 1),
          ])

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _config.anzhiyu.yml source/_data/link.yml
          git commit -m "fix: clean up inactive comments and link labels [phase2-applied]"
          git push origin HEAD:fix/site-quality-phase-2
