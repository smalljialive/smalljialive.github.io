name: Apply Music Public Daily Guard Patch

on:
  push:
    branches:
      - hexo
    paths:
      - .github/workflows/music-public-daily-guard-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Keep public queue from being overwritten by fallback catalog
        shell: python
        run: |
          from pathlib import Path

          path = Path("themes/anzhiyu/source/js/smalljia-music-personal-playlist.js")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'if (!hasCatalog(app)) installCatalog(app, providerSetSourceState);',
                  'if (!app.queue?.length && !hasCatalog(app)) installCatalog(app, providerSetSourceState);',
              ),
              (
                  'if ((state === "ready" || state === "error") && !hasCatalog(this)) scheduleInstall();',
                  'if ((state === "ready" || state === "error") && !this.queue?.length && !hasCatalog(this)) scheduleInstall();',
              ),
              (
                  'else setTimeout(() => { if (!hasCatalog(app)) installCatalog(app, providerSetSourceState); }, 12000);',
                  'else setTimeout(() => { if (!app.queue?.length && !hasCatalog(app)) installCatalog(app, providerSetSourceState); }, 12000);',
              ),
          ]

          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match for {old!r}, found {count}")
              text = text.replace(old, new, 1)
              changed = True

          if changed:
              path.write_text(text, encoding="utf-8", newline="\n")

      - name: Validate music scripts
        run: |
          node --check themes/anzhiyu/source/js/smalljia-music-personal-playlist.js
          node --check themes/anzhiyu/source/js/smalljia-music-public-daily.js

      - name: Commit patch
        run: |
          if git diff --quiet -- themes/anzhiyu/source/js/smalljia-music-personal-playlist.js; then
            echo "Guard already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/anzhiyu/source/js/smalljia-music-personal-playlist.js
          git commit -m "fix(music): preserve public Daily queue for new visitors"
          git push origin HEAD:hexo
