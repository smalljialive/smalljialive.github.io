name: Validate phase 5 deployment workflow

on:
  push:
    branches:
      - chore/modernize-deploy-workflow-phase-5
    paths:
      - .github/workflows/validate-phase5.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout blog source
        uses: actions/checkout@v6
        with:
          ref: chore/modernize-deploy-workflow-phase-5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate static pages
        run: npx hexo generate

      - name: Validate generated site
        shell: bash
        run: |
          test -f public/index.html
          count=$(find public -type f | wc -l)
          echo "Generated files: $count"
          test "$count" -gt 100

      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-phase5.yml
          git commit -m "chore: remove temporary phase 5 validation workflow"
          git push origin chore/modernize-deploy-workflow-phase-5
