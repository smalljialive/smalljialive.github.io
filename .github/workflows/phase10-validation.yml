name: Phase 10 validation

on:
  push:
    branches:
      - fix/site-quality-phase-10

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply phase 10 fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/phase10_apply.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'assert "new RegExp(keyword" not in local',
              'assert \'const regS = new RegExp(keyword, "gi");\' not in local',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python .github/phase10_apply.py

      - name: Check JavaScript syntax
        run: |
          node --check themes/anzhiyu/source/js/search/local-search.js
          node --check themes/anzhiyu/source/js/anzhiyu/right_click_menu.js

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Generate site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Validate generated output
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/js/search/local-search.js
          test -f public/search.xml
          grep -Fq 'if (!query) return;' public/js/search/local-search.js
          grep -Fq 'escapeRegExp' public/js/search/local-search.js
          grep -Fq '搜索数据库加载失败，请刷新重试' public/js/search/local-search.js
          if grep -Fq 'id="menu-commentBarrage"' public/index.html; then
            echo 'Inactive comment barrage menu is still rendered'
            exit 1
          fi
          if grep -Fq ']([https://](' 'source/_posts/一键转换】将机场节点转换为socks节点，实现一个节点一个端口.md'; then
            echo 'Broken markdown links remain in socks article'
            exit 1
          fi
          if grep -Fq ']([https://](' 'source/_posts/谷歌外链平台大区.md'; then
            echo 'Broken Blogger markdown link remains'
            exit 1
          fi
          if grep -R -Fq 'href="%5Bhttps://%5D(' public/2025/12/18 public/2024/09/09 2>/dev/null; then
            echo 'Broken encoded href remains in generated target articles'
            exit 1
          fi
          html_count=$(find public -type f -name '*.html' | wc -l)
          total_count=$(find public -type f | wc -l)
          echo "Generated HTML files: $html_count"
          echo "Generated total files: $total_count"
          test "$html_count" -ge 130
          test "$total_count" -ge 160

      - name: Commit validated changes and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/phase10_apply.py .github/workflows/phase10-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix local search and inactive menu issues'
          git push
