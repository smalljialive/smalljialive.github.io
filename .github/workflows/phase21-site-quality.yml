name: Phase 21 Site Quality

on:
  push:
    branches:
      - fix/site-quality-phase-21
    paths:
      - .github/workflows/phase21-site-quality.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/site-quality-phase-21

      - name: Apply Phase 21 fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Do not cache the page-aware navigation partial.
          header = Path("themes/anzhiyu/layout/includes/header/index.pug")
          text = header.read_text(encoding="utf-8")
          old = "!=partial('includes/header/nav', {}, {cache: true})"
          new = "!=partial('includes/header/nav', {}, {cache: false})"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one cached nav partial, found {text.count(old)}")
          header.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 2) Remove the malformed click handler from the WeChat card.
          wechat = Path("themes/anzhiyu/layout/includes/widget/card_weixin.pug")
          text = wechat.read_text(encoding="utf-8")
          old = '  .card-widget.anzhiyu-right-widget#card-wechat(onclick="window.open("/")")'
          new = '  .card-widget.anzhiyu-right-widget#card-wechat'
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one malformed WeChat onclick, found {text.count(old)}")
          wechat.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 3) Explicitly disable placeholder webmaster verification values.
          config = Path("_config.anzhiyu.yml")
          text = config.read_text(encoding="utf-8")
          pattern = re.compile(r"site_verification:\n(?:(?:  - name: [^\n]+\n)(?:    content: [^\n]*\n))+", re.MULTILINE)
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one site_verification block, found {len(matches)}")
          block = matches[0].group(0)
          required = ["google-site-verification", "baidu-site-verification", "msvalidate.01"]
          if not all(name in block for name in required):
              raise SystemExit("Verification block does not contain the expected placeholder services")
          if "content: xxx" not in block or "content: code-xxx" not in block:
              raise SystemExit("Verification block no longer matches the expected placeholder values")
          text = text[:matches[0].start()] + "site_verification: false\n" + text[matches[0].end():]
          config.write_text(text, encoding="utf-8")

      - name: Validate source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          git diff --name-only | grep -Fxq '_config.anzhiyu.yml'
          git diff --name-only | grep -Fxq 'themes/anzhiyu/layout/includes/header/index.pug'
          git diff --name-only | grep -Fxq 'themes/anzhiyu/layout/includes/widget/card_weixin.pug'
          grep -Fq "partial('includes/header/nav', {}, {cache: false})" themes/anzhiyu/layout/includes/header/index.pug
          ! grep -Fq 'onclick="window.open("/")"' themes/anzhiyu/layout/includes/widget/card_weixin.pug
          grep -Fxq 'site_verification: false' _config.anzhiyu.yml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static pages
        run: npm run build

      - name: Validate generated site
        shell: python
        run: |
          from pathlib import Path
          import re

          checks = {
              "public/index.html": "SmallJia Blog",
              "public/about/index.html": "关于本人",
              "public/music/index.html": "音乐馆",
          }
          for filename, expected in checks.items():
              html = Path(filename).read_text(encoding="utf-8")
              pattern = rf'<a id="page-name"[^>]*>{re.escape(expected)}</a>'
              if not re.search(pattern, html):
                  raise SystemExit(f"{filename}: page-name is not {expected}")

          home = Path("public/index.html").read_text(encoding="utf-8")
          if 'id="card-wechat" onclick=' in home:
              raise SystemExit("Generated WeChat card still has an onclick handler")
          if 'id="card-wechat"' not in home:
              raise SystemExit("Generated WeChat card is missing")
          for marker in ('google-site-verification', 'baidu-site-verification', 'msvalidate.01'):
              if f'name="{marker}"' in home:
                  raise SystemExit(f"Placeholder verification meta still generated: {marker}")

      - name: Commit Phase 21 fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _config.anzhiyu.yml themes/anzhiyu/layout/includes/header/index.pug themes/anzhiyu/layout/includes/widget/card_weixin.pug
          git commit -m "Fix navigation cache and invalid placeholders"
          git push origin HEAD:fix/site-quality-phase-21
