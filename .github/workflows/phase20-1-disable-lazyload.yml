name: Phase 20.1 Disable LazyLoad

on:
  push:
    branches:
      - fix/disable-lazyload-phase-20-1
    paths:
      - .github/workflows/phase20-1-disable-lazyload.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/disable-lazyload-phase-20-1

      - name: Disable LazyLoad only
        shell: python
        run: |
          from pathlib import Path

          path = Path("_config.anzhiyu.yml")
          text = path.read_text(encoding="utf-8")
          old = "lazyload:\n  enable: true\n  field: site"
          new = "lazyload:\n  enable: false\n  field: site"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one LazyLoad config match, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Validate exact config change
        shell: bash
        run: |
          set -euo pipefail
          grep -A2 '^lazyload:' _config.anzhiyu.yml | grep -Fq 'enable: false'
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "_config.anzhiyu.yml"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static pages
        run: npm run build

      - name: Validate generated homepage bypasses LazyLoad
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'vanilla-lazyload' public/index.html
          ! grep -Fq 'data-lazy-src=' public/index.html
          grep -Fq '<img class="post_bg" src="https://' public/index.html
          grep -Fq '<img class="avatar-img" src="https://' public/index.html

      - name: Commit config change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _config.anzhiyu.yml
          git commit -m "Disable image lazy loading for reliability"
          git push origin HEAD:fix/disable-lazyload-phase-20-1
