name: Phase 7 Apply and Validate

on:
  push:
    branches:
      - fix/site-quality-phase-7
    paths:
      - .github/workflows/phase7-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/site-quality-phase-7
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Apply phase 7 fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Expose configured nav-music values to the music page instead of hardcoding them in JS.
          replace_once(
              'themes/anzhiyu/layout/includes/page/music.pug',
              '#anMusic-page\n',
              '#anMusic-page(data-music-id=theme.nav_music.id data-music-server=theme.nav_music.server data-music-volume=theme.nav_music.volume)\n'
          )

          # 2) Read music page playlist/server from theme config rather than the AnZhiYu sample playlist.
          replace_once(
              'themes/anzhiyu/source/js/utils.js',
              '    const userId = "8152976493";\n    const userServer = "netease";\n    const anMusicPageMeting = document.getElementById("anMusic-page-meting");',
              '    const anMusicPage = document.getElementById("anMusic-page");\n    if (!anMusicPage) return;\n    const userId = anMusicPage.dataset.musicId;\n    const userServer = anMusicPage.dataset.musicServer;\n    const anMusicPageMeting = document.getElementById("anMusic-page-meting");'
          )

          # 3) Keep the music-page player volume in sync with nav_music.volume.
          replace_once(
              'themes/anzhiyu/source/js/utils.js',
              '    const metingAplayer = anMusicPage.querySelector("meting-js").aplayer;\n    //初始化音量\n    metingAplayer.volume(0.8, true);',
              '    const metingAplayer = anMusicPage.querySelector("meting-js").aplayer;\n    // 初始化音量，保持与 nav_music.volume 配置一致\n    const configuredVolume = Number(anMusicPage.dataset.musicVolume);\n    if (Number.isFinite(configuredVolume)) musicVolume = configuredVolume;\n    metingAplayer.volume(musicVolume, true);'
          )

          # 4) Correct only the display name; leave the existing CDN URL untouched.
          replace_once(
              'source/json/music.json',
              '"name": "说好的辛福呢"',
              '"name": "说好的幸福呢"'
          )

          # 5) Do not render essay reply buttons when no comment system is configured.
          replace_once(
              'themes/anzhiyu/layout/includes/page/essay.pug',
              '                    .bber-reply(onclick="rm.rightMenuCommentText(" + `\'${item.content}\'` + ")")\n                      i.anzhiyufont.anzhiyu-icon-message',
              '                    if page.comments !== false && theme.comments && theme.comments.use\n                      .bber-reply(onclick="rm.rightMenuCommentText(" + `\'${item.content}\'` + ")")\n                        i.anzhiyufont.anzhiyu-icon-message'
          )

          # 6) Hide right-click “quote to comment” when there is no comment area.
          replace_once(
              'themes/anzhiyu/source/js/anzhiyu/right_click_menu.js',
              '      $rightMenuCopyText.style.display = "block";\n      $rightMenuCommentText.style.display = "block";\n      $rightMenuSearch.style.display = "block";',
              '      $rightMenuCopyText.style.display = "block";\n      $rightMenuCommentText.style.display = document.getElementById("post-comment") ? "block" : "none";\n      $rightMenuSearch.style.display = "block";'
          )

          # 7) Defensive guard for any other template that might still call the quote helper.
          replace_once(
              'themes/anzhiyu/source/js/anzhiyu/right_click_menu.js',
              '  const postCommentDom = document.getElementById("post-comment");\n  var domTop = postCommentDom.offsetTop;',
              '  const postCommentDom = document.getElementById("post-comment");\n  if (!postCommentDom) return;\n  var domTop = postCommentDom.offsetTop;'
          )

      - name: JavaScript syntax checks
        run: |
          node --check themes/anzhiyu/source/js/utils.js
          node --check themes/anzhiyu/source/js/anzhiyu/right_click_menu.js

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Build Hexo site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Validate generated output
        shell: python
        run: |
          from pathlib import Path

          music = Path('public/music/index.html').read_text(encoding='utf-8')
          essay = Path('public/essay/index.html').read_text(encoding='utf-8')
          utils = Path('public/js/utils.js').read_text(encoding='utf-8')
          rightmenu = Path('public/js/anzhiyu/right_click_menu.js').read_text(encoding='utf-8') if Path('public/js/anzhiyu/right_click_menu.js').exists() else Path('themes/anzhiyu/source/js/anzhiyu/right_click_menu.js').read_text(encoding='utf-8')

          checks = {
              'music page contains configured playlist id': 'data-music-id="8307428067"' in music,
              'music page contains configured server': 'data-music-server="netease"' in music,
              'music page contains configured volume': 'data-music-volume="0.5"' in music,
              'old sample playlist id removed from generated utils': '8152976493' not in utils,
              'correct song display name present': '说好的幸福呢' in Path('public/json/music.json').read_text(encoding='utf-8'),
              'essay reply buttons absent while comments disabled': 'class="bber-reply"' not in essay,
              'right-click helper has comment guard': 'if (!postCommentDom) return;' in rightmenu,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + name)
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))

          generated = [p for p in Path('public').rglob('*') if p.is_file()]
          print(f'Generated files: {len(generated)}')

      - name: Commit validated fixes and remove temporary workflow
        run: |
          rm .github/workflows/phase7-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/anzhiyu/layout/includes/page/music.pug \
                  themes/anzhiyu/source/js/utils.js \
                  source/json/music.json \
                  themes/anzhiyu/layout/includes/page/essay.pug \
                  themes/anzhiyu/source/js/anzhiyu/right_click_menu.js \
                  .github/workflows/phase7-apply.yml
          git commit -m "Fix music page config and disabled comment actions"
          git push origin HEAD:fix/site-quality-phase-7
